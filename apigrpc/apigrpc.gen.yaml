version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: .
    include_imports: false
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway:v2.33.0
    out: .
    include_imports: false
    opt:
      - paths=source_relative
      - logtostderr=true
  - remote: buf.build/grpc/go:v1.6.0
    out: .
    include_imports: false
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.18.1
    out: .
    include_imports: false
    opt:
      - use_go_templates=true
      - allow_merge=true
      - merge_file_name=apigrpc
      - logtostderr=true
      - allow_delete_body=true
