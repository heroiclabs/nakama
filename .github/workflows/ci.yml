name: CI — Build & Test

on:
  push:
    branches: [ master, develop, feature/audit ]
  pull_request:
    branches: [ master, develop ]

jobs:
  # BUILD
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Build
        run: go build -trimpath -mod=vendor ./...

  # UNIT TESTS
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Run tests
        run: go test -vet=off -v -race ./...

  # DOCKER BUILD (smoke test)
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          push: false
          load: true
          tags: nakama-test:latest

      - name: Verify image
        run: docker images | grep nakama-test
